[project]
name = "tab"
version = "1.1.0"
description = "Add your description here"
requires-python = "== 3.12.13"
dependencies = [
    "numpy>2.2,<2.4",
    "pandas>=2.2",
    # ROCm 10.0.0 user space comes from AMD's own index; only use gfx1100
    "torch[device-gfx1100]==2.13.0+rocm10.0.0; sys_platform == 'linux'",
    "torchvision[device-gfx1100]==0.28.0+rocm10.0.0; sys_platform == 'linux'",
    "marimo>=0.23.9",
    "tabpfn>=8.1.0",
    "tabpfn-extensions[interpretability]==0.5.0",
    "shap>=0.52.0",
    "optuna>=4.9.0",
    "pydantic>=2.13.4",
    "python-json-logger>=4.1.0",
    "tabicl>=2.1.1",
    "scipy",
    "scikit-learn",
    "xgboost",
    "interpret",
    "einops",
    "huggingface-hub",
    "tqdm",
    "typing-extensions",
    "kditransform",
    "pytest>=8.4.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "ipykernel>=7.3.0",
    "mlflow>=3.14.0",
    "memray>=1.19.3",
    "tabfm[pytorch]",
    "ruff>=0.15.22",
    "dtale>=3.22.0",
    "exaonetabular",
    "causilo>=1.0.2",
    "nvtx>=0.2.16", # for limix
    "scikit-posthocs>=0.17.0",
]

[tool.uv.sources]
torch = [
    { index = "amd-rocm" },
]
torchvision = [
    { index = "amd-rocm" },
]
tabfm = { path = "external/tabfm", editable = true }
exaonetabular = { git = "https://github.com/LGAI-Research/EXAONE-Tabular.git" }

# Without `unsafe-first-match` the AMD mirror
# would win for shared packages such as numpy (we dont want that, only for rocm)
[tool.uv]
index-strategy = "unsafe-first-match"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "gpu: tests that require a CUDA/HIP-capable GPU",
    "slow: tests that are slow or download model weights",
    "integration: end-to-end pipeline tests",
]
filterwarnings = [
    "ignore:Flash Efficient attention on Current AMD GPU is still experimental:UserWarning",
    "ignore:Mem Efficient attention on Current AMD GPU is still experimental:UserWarning",
    "ignore:The argument 'device' of Tensor\\.pin_memory\\(\\) is deprecated:DeprecationWarning",
    "ignore:The argument 'device' of Tensor\\.is_pinned\\(\\) is deprecated:DeprecationWarning",
    "ignore:einx\\.rearrange is deprecated:DeprecationWarning",
    "ignore:The 'keepdims' argument in einx reduction operations is deprecated:DeprecationWarning",
    "ignore:`BaseEstimator\\._validate_data` is deprecated:FutureWarning",
    "ignore:'force_all_finite' was renamed to 'ensure_all_finite':FutureWarning",
]

[tool.ruff]
exclude = ["external"]
fix = true
line-length = 120

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: a bare expression is a cell's output, and cell variables
# are consumed by the marimo runtime rather than static analysis.
"src/plotting/notebooks/**" = ["B006", "B018", "F841"]
"src/exploration/data_filtering.py" = ["B018"]

[tool.marimo.runtime]
output_max_bytes = 10_000_000
