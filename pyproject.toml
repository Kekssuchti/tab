[project]
name = "tab"
version = "0.1.0"
description = "Add your description here"
requires-python = "== 3.12.13"
dependencies = [
    "numpy>2.2,<2.4",
    "pandas>=2.2",
    "torch==2.9.1; sys_platform == 'linux'",
    "torchvision>=0.20.1; sys_platform == 'linux'",
    "pytorch-triton-rocm>=3.1.0; sys_platform == 'linux'",
    "triton-rocm>=3.6.0; sys_platform == 'linux'",
    "marimo>=0.23.9",
    "tabpfn>=8.0.6",
    "optuna>=4.9.0",
    "pydantic>=2.13.4",
    "python-json-logger>=4.1.0",
    "tabicl>=2.1.1",
    "orion-bix",
    "orion-msp",
    "autogluon-tabular[mitra]==1.5.0",
    "scipy",
    "scikit-learn",
    "xgboost",
    "interpret",
    "einops",
    "huggingface-hub",
    "tqdm",
    "typing-extensions",
    "kditransform",
    "pytest>=8.4.0",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "ipykernel>=7.3.0",
    "mlflow>=3.14.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm" },
]
torchvision = [
    { index = "pytorch-rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm" },
]
triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
orion-bix = { git = "https://github.com/Lexsi-Labs/Orion-BiX.git", rev = "060d34606f56c591c47e0b6cbe971e5f5035f33e" }
orion-msp = { git = "https://github.com/Lexsi-Labs/Orion-MSP.git", rev = "c89aea6dc425bc701a9557fdd53e3dc3d766f983" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:Flash Efficient attention on Current AMD GPU is still experimental:UserWarning",
    "ignore:Mem Efficient attention on Current AMD GPU is still experimental:UserWarning",
    "ignore:The argument 'device' of Tensor\\.pin_memory\\(\\) is deprecated:DeprecationWarning",
    "ignore:The argument 'device' of Tensor\\.is_pinned\\(\\) is deprecated:DeprecationWarning",
    "ignore:einx\\.rearrange is deprecated:DeprecationWarning",
    "ignore:The 'keepdims' argument in einx reduction operations is deprecated:DeprecationWarning",
    "ignore:`BaseEstimator\\._validate_data` is deprecated:FutureWarning",
    "ignore:'force_all_finite' was renamed to 'ensure_all_finite':FutureWarning",
]
