name: n_estimators
base_config: ../pipeline/temp.yaml
matrix:
  # Replace the complete training list so all ensemble sizes move together in
  # each run rather than producing a Cartesian product across models.
  - path: training
    values:
      - - name: tabpfn-3.5
          tuning: &tuning-1
            method: grid
            search_space: default
            grid: { "n_estimators": [1] }
            scoring: roc_auc
        - name: tabpfn-3.5-fast
          tuning: *tuning-1
        - name: tabicl-2
          tuning: *tuning-1
        - name: tabfm
          preprocessing:
            imputer: { imputation_method: mean }
          tuning: *tuning-1
        - name: exaone
          tuning:
            method: grid
            search_space: default
            grid: { "ensemble_count": [1] }
            scoring: roc_auc
        - name: causilo
          tuning: *tuning-1

      - - name: tabpfn-3.5
          tuning: &tuning-2
            method: grid
            search_space: default
            grid: { "n_estimators": [2] }
            scoring: roc_auc
        - name: tabpfn-3.5-fast
          tuning: *tuning-2
        - name: tabicl-2
          tuning: *tuning-2
        - name: tabfm
          preprocessing:
            imputer: { imputation_method: mean }
          tuning: *tuning-2
        - name: exaone
          tuning:
            method: grid
            search_space: default
            grid: { "ensemble_count": [2] }
            scoring: roc_auc
        - name: causilo
          tuning: *tuning-2

      - - name: tabpfn-3.5
          tuning: &tuning-4
            method: grid
            search_space: default
            grid: { "n_estimators": [4] }
            scoring: roc_auc
        - name: tabpfn-3.5-fast
