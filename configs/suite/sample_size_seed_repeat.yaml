# Sample-size curve, repeated over several seed realizations.
#
# This is a cartesian product: every training fraction is trained once per seed
# realization, which is what the deprecated sample_size_repeat.sh looped in the
# shell. The seed block follows the same rules as seed_repeat.yaml: model,
# training subsample and CV fold seeds move together, while the train/test split
# and the bootstrap seed stay fixed.
name: sample-size-seed-repeat
base_config: ../pipeline/tudd_baseline.yaml
matrix:
  - path: dataset.train_on.0.fraction
    values: [50, 100, 200, 400, 800, 1600, 3200, 6400, 12800, 1.0]
  - path: random_states
    values:
      - {model_training_seed: 1337, training_sample_seed: 1337, cv_split_seed: 1337}
      - {model_training_seed: 1338, training_sample_seed: 1338, cv_split_seed: 1338}
      - {model_training_seed: 1339, training_sample_seed: 1339, cv_split_seed: 1339}
      - {model_training_seed: 1340, training_sample_seed: 1340, cv_split_seed: 1340}
      - {model_training_seed: 1341, training_sample_seed: 1341, cv_split_seed: 1341}
