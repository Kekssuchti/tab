# Compare random and KNN retrievers across five training/model seeds.
# The source split and bootstrap plan stay fixed; training_sample_seed redraws
# the sampled retriever cohort and the random baseline's training subset.

name: retriever-repeat
base_config: ../pipeline/retriever.yaml
matrix:
  - path: dataset.custom_retriever.selection_strategy
    values: ["random", "knn"]
  - path: dataset.custom_retriever.distance_metric
    values: ["euclidean"]
  - path: dataset.custom_retriever.train_size
    values: [6400]
  - path: dataset.custom_retriever.test_on.0.fraction
    values: [1000]
  - path: random_states
    values:
      - { model_training_seed: 1337, training_sample_seed: 1337, cv_split_seed: 1337 }
      - { model_training_seed: 1338, training_sample_seed: 1338, cv_split_seed: 1338 }
      - { model_training_seed: 1339, training_sample_seed: 1339, cv_split_seed: 1339 }
      - { model_training_seed: 1340, training_sample_seed: 1340, cv_split_seed: 1340 }
      - { model_training_seed: 1341, training_sample_seed: 1341, cv_split_seed: 1341 }
