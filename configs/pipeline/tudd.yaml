dataset:
  target: mortality
  random_state: 1337
  train_size: 0.8
  train_on:
    - dataset: tudd
      fraction: 1.0
  data_cleaner:
    outlier_limits_path: configs/data_limits.json
    missing_threshold_row: 0.5
  scaler_encoder:
    type: none
  imputer:
    imputation_method: none
    flag_missing: false
    knn_neighbors: 5

training:
  - name: tabpfn-3
    tuning:
      scoring: roc_auc
      cv:
        n_splits: 5
        shuffle: true
        random_state: 1337

  - name: tabicl-2
    tuning:
      scoring: roc_auc
      cv:
        n_splits: 5
        shuffle: true
        random_state: 1337

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  artifact_location: mlartifacts
  experiment_name: tab
