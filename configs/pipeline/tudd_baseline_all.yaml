random_states:
  model_training_seed: 1337
  model_inference_seed: 1337
  cv_split_seed: 1337
  tuning_sampler_seed: 1337
  training_sample_seed: 1337
  evaluation_bootstrap_seed: 1337

dataset:
  target: mortality
  random_state: 1337
  train_size: 0.8
  train_on:
    - dataset: tudd
      fraction: 1.0
  data_cleaner:
    outlier_limits_path: configs/data_limits.json
    missing_threshold_row: 0.5
  scaler_encoder:
    type: none
  imputer:
    imputation_method: none
    flag_missing: false
    knn_neighbors: 5

training:
  - name: logistic-regression
    preprocessing:
      imputer:
        imputation_method: mean
      scaler_encoder:
        type: standardization
    tuning:
      method: optuna
      search_space: good
      scoring: roc_auc
      optuna:
        n_trials: 100
        sampler: tpe
        n_startup_trials: 10
        timeout: null
      cv:
        n_splits: 5
        shuffle: true

  - name: xgboost
    tuning:
      method: optuna
      search_space: good
      scoring: roc_auc
      optuna:
        n_trials: 100
        sampler: tpe
        n_startup_trials: 10
        timeout: null
      cv:
        n_splits: 5
        shuffle: true

  - name: ebm
    tuning:
      method: optuna
      search_space: default
      scoring: roc_auc
      optuna:
        n_trials: 50
        sampler: tpe
        n_startup_trials: 5
        timeout: null
      cv:
        n_splits: 5
        shuffle: true

  - name: tabpfn-3
    tuning:
      method: grid
      search_space: best
      scoring: roc_auc
      cv:
        n_splits: 5
        shuffle: true

  - name: tabpfn-2.5
    tuning:
      method: grid
      search_space: best_2_5
      scoring: roc_auc
      cv:
        n_splits: 5
        shuffle: true

  - name: tabpfn-2.6
