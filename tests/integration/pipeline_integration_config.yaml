run_number: 1
run_date: 2026-06-23

dataset:
  target: mortality
  random_state: 11
  train_size: 0.6
  train_on:
    - dataset: mimic
      fraction: 1.0
    - dataset: tudd
      fraction: 1.0
  classification: true
  data_cleaner:
    missing_threshold_row: 0.5
  scaler_encoder:
    type: none
  imputer:
    imputation_method: none
    flag_missing: false

training:
  - name: xgboost
    task_type: classification
    params:
      n_estimators: 2
      max_depth: 1
      learning_rate: 0.3
      subsample: 1.0
      n_jobs: 1
      random_state: 11
    tuning:
      scoring: accuracy
      grid:
        n_estimators: [2, 3]
        max_depth: [1]
      cv:
        n_splits: 2
        shuffle: true
        random_state: 11
  - name: tabpfn-3
    task_type: classification
    params:
      device: cpu
      random_state: 11
      show_progress_bar: false
    tuning:
      scoring: accuracy
      grid:
        n_estimators: [2]
      cv:
        n_splits: 2
        shuffle: true
        random_state: 11

plotting:
  enabled: false
  formats:
    - png
