random_states:
  model_training_seed: 11
  model_inference_seed: 11
  cv_split_seed: 11
  tuning_sampler_seed: 11
  training_sample_seed: 11
  evaluation_bootstrap_seed: 11

dataset:
  target: mortality
  random_state: 11
  train_size: 0.6
  train_on:
    - dataset: mimic
      fraction: 1.0
    - dataset: tudd
      fraction: 1.0
  data_cleaner:
    missing_threshold_row: 0.5
  scaler_encoder:
    type: none
  imputer:
    imputation_method: none
    flag_missing: false

training:
  - name: xgboost
    tuning:
      method: grid
      scoring: accuracy
      grid:
        n_estimators: [2, 3]
        max_depth: [1]
        learning_rate: [0.3]
        subsample: [1.0]
        n_jobs: [1]
      cv:
        n_splits: 2
        shuffle: true
  - name: tabpfn-3
    tuning:
      method: grid
      scoring: accuracy
      grid:
        n_estimators: [2]
        device: [cpu]
        show_progress_bar: [false]
      cv:
        n_splits: 2
        shuffle: true
